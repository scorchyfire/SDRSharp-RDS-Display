name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Build (Release)
        run: dotnet build sdrplugins/sdrplugins.sln --configuration Release

      - name: Create release zip
        shell: pwsh
        run: |
          $outDir = "sdrplugins/Release/net7.0-windows"
          Compress-Archive -Path "$outDir/SDRSharp.RdsDisplay.dll", "$outDir/pi_codes.json" `
            -DestinationPath "SDRSharp.RdsDisplay.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDRSharp.RdsDisplay
          path: SDRSharp.RdsDisplay.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SDRSharp.RdsDisplay.zip
