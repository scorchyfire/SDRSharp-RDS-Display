name: Build and Release (Main)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      - name: Build (Release)
        run: dotnet build sdrplugins/sdrplugins.sln --configuration Release

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content "version.txt" -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "version.txt is empty"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create release zip
        shell: pwsh
        run: |
          $outDir = "sdrplugins/Release/net7.0-windows"
          $zipName = "SDRSharp_v1911andunder-RDS-Display-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path "$outDir/SDRSharp.RdsDisplay.dll", "$outDir/pi_codes.json" -DestinationPath $zipName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDRSharp_v1911andunder-RDS-Display-${{ steps.version.outputs.version }}
          path: SDRSharp_v1911andunder-RDS-Display-${{ steps.version.outputs.version }}.zip

      - name: Check release eligibility
        if: github.event_name == 'push'
        id: release_gate
        shell: pwsh
        run: |
          $currentVersion = "${{ steps.version.outputs.version }}"
          $before = "${{ github.event.before }}"
          $shouldRelease = $false

          if ($before -and $before -ne "0000000000000000000000000000000000000000") {
            $changed = git diff --name-only $before "${{ github.sha }}" -- version.txt
            if ($changed) {
              $versionExistsInBefore = git ls-tree --name-only $before -- version.txt
              $previousVersion = if ($versionExistsInBefore) { (git show "${before}:version.txt").Trim() } else { "" }
              if ($previousVersion -ne $currentVersion) {
                $shouldRelease = $true
              }
            }
          }

          if (-not $shouldRelease) {
            Write-Host "Skipping release: version.txt not changed to a different version."
          }

          "should_release=$($shouldRelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        if: github.event_name == 'push' && steps.release_gate.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }} - SDRSharp <=v1911
          target_commitish: ${{ github.sha }}
          files: SDRSharp_v1911andunder-RDS-Display-${{ steps.version.outputs.version }}.zip
