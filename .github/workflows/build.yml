name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Build (Release)
        run: dotnet build sdrplugins/sdrplugins.sln --configuration Release

      - name: Create release zip
        shell: pwsh
        run: |
          $outDir = "sdrplugins/Release/net7.0-windows"
          Compress-Archive -Path "$outDir/SDRSharp.RdsDisplay.dll", "$outDir/pi_codes.json" `
            -DestinationPath "SDRSharp.RdsDisplay.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDRSharp.RdsDisplay
          path: SDRSharp.RdsDisplay.zip

      - name: Determine next release tag
        if: github.event_name != 'pull_request'
        id: next_tag
        uses: actions/github-script@v7
        with:
          script: |
            const tags = await github.paginate(github.rest.repos.listTags, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            let maxMajor = 0;
            let maxMinor = 0;
            let hasVersionTag = false;

            for (const tag of tags) {
              const match = /^v(\d+)\.(\d+)$/.exec(tag.name);
              if (!match) {
                continue;
              }

              const major = Number(match[1]);
              const minor = Number(match[2]);

              if (!hasVersionTag || major > maxMajor || (major === maxMajor && minor > maxMinor)) {
                maxMajor = major;
                maxMinor = minor;
                hasVersionTag = true;
              }
            }

            const nextTag = hasVersionTag ? `v${maxMajor}.${maxMinor + 1}` : 'v0.1';
            core.setOutput('tag', nextTag);
            core.info(`Next release tag: ${nextTag}`);

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.next_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: SDRSharp.RdsDisplay.zip
